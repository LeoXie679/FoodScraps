<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Bezel -->
  <circle cx="16" cy="16" r="15.5" fill="#1a1f16"/>
  <circle cx="16" cy="16" r="13.5" fill="#0a1208"/>

  <!-- Range rings -->
  <circle cx="16" cy="16" r="11" fill="none" stroke="#1f3d1a" stroke-width="0.6"/>
  <circle cx="16" cy="16" r="7.5" fill="none" stroke="#1f3d1a" stroke-width="0.55"/>
  <circle cx="16" cy="16" r="4" fill="none" stroke="#1f3d1a" stroke-width="0.5"/>

  <!-- Crosshairs -->
  <path d="M16 4.5 V27.5 M4.5 16 H27.5" stroke="#1f3d1a" stroke-width="0.45"/>

  <!-- Sweep / phosphor trail (classic PPI wedge) -->
  <path d="M16 16 L16 5 A11 11 0 0 1 25.5 20.5 Z" fill="#3dff4a" opacity="0.22"/>
  <path d="M16 16 L16 5 A11 11 0 0 1 22.2 8.9 Z" fill="#6aff73" opacity="0.55"/>

  <!-- Leading sweep line -->
  <line x1="16" y1="16" x2="16" y2="5" stroke="#9dff9a" stroke-width="1.1" stroke-linecap="round"/>

  <!-- Blips -->
  <circle cx="21.5" cy="11.2" r="1.05" fill="#7CFF7A"/>
  <circle cx="12.2" cy="20.8" r="0.75" fill="#4dff55" opacity="0.85"/>
  <circle cx="19.8" cy="22.4" r="0.55" fill="#3dff4a" opacity="0.7"/>

  <!-- Center pip -->
  <circle cx="16" cy="16" r="1.35" fill="#b8ffb0"/>

  <!-- Glass rim highlight -->
  <circle cx="16" cy="16" r="13.5" fill="none" stroke="#2a3824" stroke-width="0.8"/>
</svg>
