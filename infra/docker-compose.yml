# Run from repo root:
#   docker compose -f infra/docker-compose.yml up -d --build
#
# First time: copy .env.example → .env and fill keys.
# For IP-only demo (no domain yet): SITE_ADDRESS=:80

services:
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    env_file:
      - ../.env
    restart: unless-stopped
    expose:
      - "8000"
    depends_on:
      - pipeline
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  # Person B vision pipeline — internal URL for API: http://pipeline:8001/process
  pipeline:
    build:
      context: ..
      dockerfile: infra/Dockerfile.pipeline
    env_file:
      - ../.env
    restart: unless-stopped
    expose:
      - "8001"
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  web-build:
    image: node:22-alpine
    working_dir: /src
    volumes:
      - ../web:/src
      - web_node_modules:/src/node_modules
      - web_dist:/out
    command: sh -c "npm install && npm run build && rm -rf /out/* && cp -r dist/* /out/"

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      CADDY_EMAIL: ${CADDY_EMAIL:-hack@example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - web_dist:/srv
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_started
      web-build:
        condition: service_completed_successfully

  # Every 30 minutes: scrape club posts, then run Person B's pipeline.
  scrape-cron:
    image: curlimages/curl:8.10.1
    env_file:
      - ../.env
    environment:
      SCRAPE_CRON_URL: http://api:8000/admin/scrape-now
      SCRAPE_CRON_INTERVAL_SEC: ${SCRAPE_CRON_INTERVAL_SEC:-1800}
    volumes:
      - ./scrape_cron.sh:/scrape_cron.sh:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "scrape-cron up; first run in 90s, then every $${SCRAPE_CRON_INTERVAL_SEC:-1800}s"
        sleep 90
        while true; do
          /bin/sh /scrape_cron.sh || echo "scrape-cron tick failed"
          sleep "$${SCRAPE_CRON_INTERVAL_SEC:-1800}"
        done

volumes:
  web_node_modules:
  web_dist:
  caddy_data:
  caddy_config:
